name: Build Ak Finance Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Capacitor Sync Android
        run: npx cap sync android

      - name: Show Capacitor and Gradle versions
        run: |
          grep '"@capacitor/' package.json || true
          cat android/gradle/wrapper/gradle-wrapper.properties || true
          grep -n "com.android.tools.build:gradle" android/build.gradle || true

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show Gradle Error Summary
        if: failure()
        working-directory: android
        run: |
          grep -n -A 15 "What went wrong" build.log || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ak-finance-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
